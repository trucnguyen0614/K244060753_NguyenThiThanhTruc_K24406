<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniShop - Website bán hàng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">🛍️ MiniShop</h1>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="html/admin.html">Admin</a>
      <button id="btnSync" class="btn-small" type="button">Đồng bộ API -&gt; XML</button>
      <button id="btnCart" class="btn-cart" type="button">🛒 Giỏ hàng (<span id="cartCount">0</span>)</button>
    </nav>
  </header>

  <div id="miniCart" class="mini-cart" hidden></div>

  <div class="layout">
    <aside class="sidebar">
      <h2>Tìm kiếm nâng cao</h2>
      <form id="searchForm">
        <label for="priceMin">Giá từ ($)</label>
        <input type="number" id="priceMin" name="priceMin" min="0" max="1000" step="1" value="0" required placeholder="VD: 0">

        <label for="priceMax">Giá đến ($)</label>
        <input type="number" id="priceMax" name="priceMax" min="0" max="1000" step="1" value="1000" required placeholder="VD: 1000">

        <fieldset>
          <legend>Màu sắc</legend>
          <label><input type="checkbox" name="color" value="Đỏ"> Đỏ</label>
          <label><input type="checkbox" name="color" value="Xanh"> Xanh</label>
          <label><input type="checkbox" name="color" value="Đen"> Đen</label>
          <label><input type="checkbox" name="color" value="Trắng"> Trắng</label>
        </fieldset>

        <label for="minRating">Đánh giá tối thiểu (1-5 sao)</label>
        <input type="number" id="minRating" name="minRating" min="1" max="5" step="1" value="1" required placeholder="1 - 5">

        <label for="category">Danh mục</label>
        <select id="category" name="category" required>
          <option value="">-- Tất cả danh mục --</option>
          <optgroup label="Thời trang">
            <option value="men's clothing">Thời trang nam</option>
            <option value="women's clothing">Thời trang nữ</option>
          </optgroup>
          <optgroup label="Phụ kiện">
            <option value="jewelery">Trang sức</option>
            <option value="electronics">Điện tử</option>
          </optgroup>
        </select>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Lọc</button>
          <button type="reset" class="btn-secondary">Xóa lọc</button>
        </div>
      </form>
    </aside>

    <main>
      <section class="products-section">
        <h2>Danh sách sản phẩm</h2>
        <p id="resultInfo" class="result-info"></p>
        <div id="productList" class="product-grid"></div>
      </section>
    </main>
  </div>

  <!-- Modal Xem nhanh -->
  <div class="modal" id="quickModal" hidden>
    <div class="modal-box"><button class="modal-close" data-close="1">&times;</button><div id="quickBody"></div></div>
  </div>
  <!-- Modal Rating Detail -->
  <div class="modal" id="ratingModal" hidden>
    <div class="modal-box"><button class="modal-close" data-close="1">&times;</button><div id="ratingBody"></div></div>
  </div>
  <!-- Modal Thanh toán -->
  <div class="modal" id="checkoutModal" hidden>
    <div class="modal-box"><button class="modal-close" data-close="1">&times;</button><div id="checkoutBody"></div></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <footer class="site-footer">
    <p>Họ và Tên: Nguyễn Thị Thanh Trúc</p>
    <p>Mã Số Sinh Viên: K244060753</p>
    <p>Lớp: K24406</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
